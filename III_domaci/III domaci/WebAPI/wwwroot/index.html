<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HR Oglasi - Upravljanje konkursima</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div id="desktop">
        <div id="pocetna">
            <div class="pocetna-icon" id="iconOglasi">
                <div class="glyph">&#128203;</div>
                <span class="label">Oglasi</span>
            </div>
            <div class="pocetna-icon" id="iconCV">
                <div class="glyph">&#128193;</div>
                <span class="label">CV prijave</span>
            </div>
        </div>
    </div>

    <div id="taskbar">
        <div class="start-badge">&#9632; HR Oglasi</div>
        <div class="task-items" id="taskItems"></div>
        <div class="task-clock" id="clock">--:--</div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/screens.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
